name: app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/le-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: format
            command: cargo fmt -p ledaw --check
          - name: test
            command: cargo test -p ledaw --all-targets
          - name: clippy
            command: cargo clippy -p ledaw --all-targets -- -D warnings
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - run: ${{ matrix.check.command }}

  fuzz:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/le-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: fuzz
        shell: bash
        run: |
          seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "Seed: $seed"
          echo "Reproduce with: cargo run -p ledaw --bin fuzz -- $seed"
          xvfb-run -a cargo run -p ledaw --bin fuzz -- "$seed"

  gigafuzz:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/le-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: gigafuzz
        shell: bash
        run: |
          cargo build -p ledaw --bin fuzz

          for run in $(seq 1 20); do
            seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
            echo "Run $run/20 — seed: $seed"
            echo "Reproduce with: target/debug/fuzz $seed"
            xvfb-run -a target/debug/fuzz "$seed"
          done

  line_count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report Rust line counts
        shell: bash
        run: |
          count() {
            git ls-files "$@" | xargs wc -l | awk 'END { print $1 }'
          }

          all_code=$(count 'app/src' ':!app/src/lib.rs' ':!app/src/bin/**')
          core=$(count 'app/src' ':!app/src/lib.rs' ':!app/src/bin/**' ':!app/src/plugin.rs' ':!app/src/plugin/**' ':!app/src/instrument.rs' ':!app/src/instrument/**')
          components=$(count 'app/src/plugin.rs' 'app/src/plugin' 'app/src/instrument.rs' 'app/src/instrument')
          test=$(count 'app/src/lib.rs' 'app/src/bin')

          {
            echo '## Line Counts'
            echo
            echo '| Category | Lines |'
            echo '| --- | ---: |'
            echo "| All code | $all_code |"
            echo "| Components | $components |"
            echo "| Core | $core |"
            echo "| Test | $test |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
